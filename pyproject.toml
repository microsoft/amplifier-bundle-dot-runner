[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "amplifier-dot-runner"
version = "0.4.1"
description = "dot-runner root install with the mandatory public Amplifier Agent adapter"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [{ name = "Microsoft MADE:Explorations Team" }]
dependencies = [
    # Direct references are required for Foundation's --no-sources activation.
    "amplifier-module-pipeline-runner @ git+https://github.com/microsoft/amplifier-bundle-dot-runner@main#subdirectory=modules/pipeline-runner",
    "amplifier-module-loop-amplifier-agent @ git+https://github.com/microsoft/amplifier-bundle-dot-runner@main#subdirectory=modules/loop-amplifier-agent",
    "amplifier-module-loop-agent @ git+https://github.com/microsoft/amplifier-bundle-dot-runner@main#subdirectory=modules/loop-agent",
]

[project.urls]
Homepage = "https://github.com/microsoft/amplifier-bundle-dot-runner"
Repository = "https://github.com/microsoft/amplifier-bundle-dot-runner"

[project.scripts]
dot-runner = "amplifier_dot_runner:main"

[tool.uv]
# Lock-only correction: upstream's workspace=true engine source otherwise
# leaks the binding-main checkout into our lock, bypassing its published tag.
# Fresh --no-config --no-sources installations qualify the real metadata
# independently; Foundation is deliberately NOT overridden.
override-dependencies = [
    "amplifier-agent-engine[github-copilot] @ git+https://github.com/microsoft/amplifier-agent@v0.22.0#subdirectory=packages/engine",
]

[tool.uv.sources]
amplifier-module-pipeline-runner = { path = "modules/pipeline-runner" }
amplifier-module-loop-amplifier-agent = { path = "modules/loop-amplifier-agent" }
amplifier-module-loop-agent = { path = "modules/loop-agent" }

[tool.hatch.build.targets.wheel]
packages = ["amplifier_dot_runner"]

[tool.hatch.metadata]
allow-direct-references = true