[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "amplifier-dot-runner"
version = "0.2.0"
description = "dot-runner: the engine that runs .dot pipelines. Root install package -- `uv tool install git+https://github.com/microsoft/amplifier-bundle-dot-runner` (no #subdirectory) lands exactly one console script, dot-runner. Thin re-export of modules/pipeline-runner; see amplifier_dot_runner's module docstring."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Microsoft MADE:Explorations Team" },
]
dependencies = [
    "amplifier-module-pipeline-runner",
]

# NOTE: microsoft/amplifier-agent (the `[agent]` extra's own peer library)
# is deliberately NOT declared here as a formal `[project.optional-
# dependencies]` group. Review finding: merely declaring it -- even behind
# a `python_version >= "3.12"` marker -- still breaks `uv lock`/`uv sync`/
# `uv run` for THIS WHOLE root project (not just an explicit `[agent]`
# install), because uv's default universal-resolution model must still
# prove the "marker is true" split resolvable, and that split hits the
# same real, disclosed, cross-repo dependency-declaration collision
# documented in README's "The [agent] extra" section ("conflicting URLs
# for package amplifier-foundation"). A formal extra that breaks `uv lock`
# for every consumer of this package -- including ones who never asked for
# it, like this repo's own "Validate Bundle Repo" CI job -- is worse than
# no formal extra at all. The feature itself is unaffected: `default_worker
# .amplifier_agent_available()` only probes what is actually installed
# (`importlib.util.find_spec`), regardless of how it got there, so the
# README's two-step `uv pip install` workaround (which never goes through
# this table) remains the fully-supported, proven-working install path.
[project.urls]
Homepage = "https://github.com/microsoft/amplifier-bundle-dot-runner"
Repository = "https://github.com/microsoft/amplifier-bundle-dot-runner"

[project.scripts]
dot-runner = "amplifier_dot_runner:main"

[tool.uv.sources]
# Relative-path dependency onto modules/pipeline-runner's own package --
# NOT a copy, NOT a fork. modules/pipeline-runner keeps its own name,
# pyproject.toml, and `dot-runner` console script fully intact, so the
# existing `#subdirectory=modules/pipeline-runner` install form is
# unaffected by this root package's existence.
amplifier-module-pipeline-runner = { path = "modules/pipeline-runner" }

[tool.hatch.build.targets.wheel]
packages = ["amplifier_dot_runner"]

[tool.hatch.metadata]
# Required because [project.optional-dependencies] "agent" below uses
# direct references (git+https:// URLs) -- hatchling refuses to build a
# package declaring those unless this is explicitly set. Mirrors
# modules/pipeline-runner/pyproject.toml and modules/loop-amplifier-agent/
# pyproject.toml, which already carry this same flag for the same reason.
allow-direct-references = true
