[project]
name = "amplifier-module-loop-agent"
version = "0.1.0"
description = "Attractor coding agent loop orchestrator for Amplifier"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Microsoft MADE:Explorations Team" },
]
dependencies = [
    "amplifier-core>=0.1.0",
    # Direct git reference (not a bare name) so the dependency resolves even
    # when the foundation activator installs with `--no-sources`, which strips
    # the `[tool.uv.sources]` path override below. The package is vendored
    # in-repo and unpublished (renamed in #50 to avoid a PyPI name collision);
    # a direct reference keeps that collision-avoidance (uv never queries an
    # index for the name) while surviving `--no-sources`. The path source is
    # retained below for local editable development.
    "amplifier-unified-llm-client @ git+https://github.com/microsoft/amplifier-bundle-dot-runner@main#subdirectory=modules/unified-llm-client",
]

[project.entry-points."amplifier.modules"]
loop-agent = "amplifier_module_loop_agent:mount"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = true

[tool.uv.sources]
# issue #338 point 2: loop-agent is now a root path-dependency of
# amplifier-dot-runner (see root pyproject.toml). The root graph ALSO
# reaches amplifier-unified-llm-client via amplifier-module-pipeline-runner
# -> amplifier-module-loop-pipeline, whose own [tool.uv.sources] redirects
# that edge to a local path. Leaving loop-agent's own edge on its
# previously-unmodified git+ URL gave uv two different SHAPES for the same
# package identity within the ROOT resolution ("Requirements contain
# conflicting URLs for package amplifier-unified-llm-client"). Redirecting
# it here too resolves the root graph.
#
# Trade-off (accepted -- see issue #338 fix notes): this module's OWN
# dev-inclusive `uv sync`/`uv run pytest` resolution has historically relied
# on this edge staying UNMODIFIED so it matches worker-parity-kit's (a
# dev-only dependency, below) own separately-fetched transitive chain onto
# the same package. `uv tool install` -- the root production path this
# unblocks -- never resolves dev dependency-groups, so that historical
# constraint does not apply there. For THIS module's own dev-group
# resolution, `pythonpath` below still points `../unified-llm-client` first
# regardless of which copy `uv sync` installs, so what loop-agent's own
# tests actually IMPORT is unaffected either way.
amplifier-unified-llm-client = { path = "../unified-llm-client" }

[tool.hatch.build.targets.wheel]
packages = ["amplifier_module_loop_agent"]

[tool.hatch.metadata]
allow-direct-references = true

[dependency-groups]
dev = [
    "amplifier-core",
    "pytest>=8.0.0",
    "pytest-asyncio>=1.0.0",
    # worker-parity-kit: executed tests pinning the dot-runner worker seam
    # (WorkerHarness protocol, M1-M3 + TARGET suite) across orchestrator
    # workers -- see modules/loop-agent/tests/test_worker_parity.py and the
    # kit's own README ("Why this exists") in amplifier-bundle-dot-runner.
    # Direct git reference (mirrors this same dependency-group's sibling-repo
    # pattern; no local path override exists because the kit's home repo is
    # not checked out alongside this one).
    "amplifier-worker-parity-kit @ git+https://github.com/microsoft/amplifier-bundle-dot-runner@main#subdirectory=modules/worker-parity-kit",
    # Listed explicitly (not just pulled in transitively via the kit above)
    # to pin this dependency-group's own edge to the same git+ URL/ref the
    # kit's transitive edge onto this package already resolves to -- NOT
    # because of a `[tool.uv.sources]` redirect: that table (above, on
    # `[tool.uv.sources]`) is empty now, by design (see the NOTE there).
    # With no override, this package resolves via its declared git+ URL,
    # byte-identical to the kit's own transitive chain into the same
    # repo/subdirectory, so there is only ever one source for the name --
    # nothing for uv to conflict on. This has no bearing on what this
    # module's own tests actually import either way: `pythonpath` below
    # still points `../unified-llm-client` first, so the in-repo source
    # tree wins over whatever `uv sync` installs into this module's venv
    # (empirically verified: suite green and hermetic with the override
    # removed).
    "amplifier-module-loop-pipeline @ git+https://github.com/microsoft/amplifier-bundle-dot-runner@main#subdirectory=modules/loop-pipeline",
]



[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
asyncio_mode = "strict"
# ../hooks-tool-truncation: test_truncation_e2e_real_hook.py mounts the real
# hooks-tool-truncation module on a real amplifier_core.HookRegistry to prove
# the tool:post wiring fix end-to-end (amplifier-support#485), not just
# against a fake hook double.
pythonpath = [".", "../unified-llm-client", "../hooks-tool-truncation"]
