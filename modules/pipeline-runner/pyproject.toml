[project]
name = "amplifier-module-pipeline-runner"
version = "0.2.1"
description = "Reusable engine-driving library + CLI for standalone DOT pipeline runs"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Microsoft MADE:Explorations Team" }]
dependencies = [
    "amplifier-core>=2.0.1",
    # Narrow consumer exception: the public binding's v0.22.0 engine requires
    # this exact Foundation source. main conflicts in an unoverridden solve.
    # Direct URL also survives Foundation activation with --no-sources.
    "amplifier-foundation @ git+https://github.com/microsoft/amplifier-foundation@21ad50fa40f7acff913cbf6615228ac359f7dedd",
    "amplifier-module-loop-pipeline[remote] @ git+https://github.com/microsoft/amplifier-bundle-dot-runner@main#subdirectory=modules/loop-pipeline",
]

[project.scripts]
dot-runner = "amplifier_module_pipeline_runner.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = true

[tool.uv.sources]
amplifier-foundation = { git = "https://github.com/microsoft/amplifier-foundation", rev = "21ad50fa40f7acff913cbf6615228ac359f7dedd" }
amplifier-module-loop-pipeline = { path = "../loop-pipeline" }
amplifier-module-remote-source = { path = "../remote-source" }

[tool.hatch.build.targets.wheel]
packages = ["amplifier_module_pipeline_runner"]

[tool.hatch.metadata]
allow-direct-references = true

[dependency-groups]
dev = ["pytest>=8.0.0", "pytest-asyncio>=1.0.0", "amplifier-module-remote-source"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
asyncio_mode = "strict"
pythonpath = ["../loop-pipeline", "../unified-llm-client"]