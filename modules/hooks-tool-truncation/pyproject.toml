[project]
name = "amplifier-module-hooks-tool-truncation"
version = "0.1.0"
description = "Hook module - Tool output truncation for context management"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Microsoft MADE:Explorations Team" },
]
dependencies = [
    "amplifier-core>=0.1.0",
]

[project.entry-points."amplifier.modules"]
hooks-tool-truncation = "amplifier_module_hooks_tool_truncation:mount"

[build-system]
requires = [
    "hatchling",
]
build-backend = "hatchling.build"

[tool.uv]
package = true



[tool.hatch.build.targets.wheel]
packages = [
    "amplifier_module_hooks_tool_truncation",
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
asyncio_mode = "strict"

[dependency-groups]
dev = [
    "amplifier-core",
    # Real approved dispatch and isolated JavaScript worker regression tests.
    "amplifier-module-loop-live @ git+https://github.com/microsoft/amplifier-module-loop-live@76073827ba6742ae026a12b524f596120cd2b314",
    "amplifier-module-context-simple @ git+https://github.com/microsoft/amplifier-module-context-simple@db641363013ff906b656f49498a87ab01f5c506f",
    "amplifier-module-tool-exec @ git+https://github.com/microsoft/amplifier-module-tool-exec@f267548ccd1b38a236a46afb96252bb6dd474dcd",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
]
