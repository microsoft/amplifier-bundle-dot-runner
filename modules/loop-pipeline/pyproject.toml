[project]
name = "amplifier-module-loop-pipeline"
version = "0.4.0"
description = "Attractor pipeline orchestrator - DOT graph-driven multi-stage AI workflows"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Microsoft MADE:Explorations Team" },
]
dependencies = [
    "amplifier-core>=0.1.0",
    # Direct git reference (not a bare name) so the dependency resolves even
    # when the foundation activator installs with `--no-sources`, which strips
    # the `[tool.uv.sources]` path override below. The package is vendored
    # in-repo and unpublished (renamed in #50 to avoid a PyPI name collision);
    # a direct reference keeps that collision-avoidance (uv never queries an
    # index for the name) while surviving `--no-sources`. The path source is
    # retained below for local editable development.
    "amplifier-unified-llm-client @ git+https://github.com/microsoft/amplifier-bundle-dot-runner@main#subdirectory=modules/unified-llm-client",
]

[project.optional-dependencies]
# Layer A fetcher — pulled in only when remote git+https:// sources are used.
# Direct git ref survives `--no-sources`; the [tool.uv.sources] path below is
# for local editable dev (mirrors the amplifier-unified-llm-client pattern).
remote = [
    "amplifier-module-remote-source @ git+https://github.com/microsoft/amplifier-bundle-dot-runner@main#subdirectory=modules/remote-source",
]

[project.entry-points."amplifier.modules"]
loop-pipeline = "amplifier_module_loop_pipeline:mount"

[build-system]
requires = [
    "hatchling",
]
build-backend = "hatchling.build"

[tool.uv]
package = true

# issue #338 point 2: amplifier-module-loop-agent is now a root path-
# dependency of amplifier-dot-runner (see root pyproject.toml). loop-agent's
# own [project.dependencies] declares amplifier-unified-llm-client via a
# direct, unmodified git+ URL (deliberately -- see that module's own
# [tool.uv.sources] comment: a local-path redirect there conflicts with its
# OWN dev-only worker-parity-kit chain, which needs the unmodified git+ URL
# shape). Keeping THIS module's own redirect to a local path then gave uv
# two different SHAPES for the same package identity the moment both
# modules were pulled into ONE root resolution ("Requirements contain
# conflicting URLs for package amplifier-unified-llm-client"). Removing this
# module's own override (rather than touching loop-agent's own, already-
# reasoned-about dev/test convention) resolves it: this module's OWN edge
# now resolves via its already-declared git+ URL too, matching loop-agent's
# shape exactly. Nothing in this module's OWN test suite exercises
# unified-llm-client's newly-added detect_configured_providers() (that is
# covered by pipeline-runner's hermetic test_synthesized_bundle_providers.py
# instead, via that module's own pytest `pythonpath` entry).
[tool.uv.sources]
amplifier-unified-llm-client = { path = "../unified-llm-client" }
amplifier-module-remote-source = { path = "../remote-source" }
# Test-only, same-repo path source: tests/test_worker_parity.py wires the
# `direct` worker into worker-parity-kit's shared M1-M3 + TARGET suite (see
# that module's README, "Why this exists"). Editable so the test always
# runs the working tree's kit. Mirrors loop-amplifier-agent/pyproject.toml's
# identical dev-only wiring.
amplifier-worker-parity-kit = { path = "../worker-parity-kit", editable = true }

[tool.hatch.build.targets.wheel]
packages = [
    "amplifier_module_loop_pipeline",
]

[tool.hatch.metadata]
allow-direct-references = true

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=1.0.0",
    "respx>=0.22",
    "amplifier-worker-parity-kit",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
asyncio_mode = "strict"

[tool.ruff.lint.per-file-ignores]
# Test files set up sys.modules stubs before importing the module under test.
# This requires late imports (after the stub setup), which ruff flags as E402.
"tests/*.py" = ["E402"]
