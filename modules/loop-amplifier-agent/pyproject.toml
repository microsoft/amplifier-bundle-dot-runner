[project]
name = "amplifier-module-loop-amplifier-agent"
version = "0.1.0"
description = "Adapter orchestrator using the public Amplifier Agent Python binding"
license = "MIT"
# amplifier-agent (the peer library this adapter hosts) declares
# `requires-python = ">=3.12"` (verified against its own pyproject.toml on
# 2026-08-26, both a pre-existing dev clone and a fresh `@main` clone,
# commit 530bb7d). This module cannot support a lower floor than the
# library it wraps, so it deliberately deviates from this repo's usual
# `>=3.11` floor. See .github/workflows/ci.yml's `unit-tests` matrix
# `exclude:` entry and this module's README ("Python version note") for
# the CI-visible consequence: this module's job runs on py3.12/3.13 only,
# not the repo's usual py3.11/3.13 pair.
requires-python = ">=3.12"
authors = [
    { name = "Microsoft MADE:Explorations Team" },
]
dependencies = [
    "amplifier-core>=2.0.1",
    # The peer library this adapter hosts. Direct git reference (not a bare
    # PyPI name): amplifier-agent is not published to PyPI. Floats on @main
    # deliberately, mirroring every other `@main` git dependency in this
    # repo's modules (see pipeline-runner/pyproject.toml's own comment on
    # why a SHA pin here would collide with other consumers' `@main` refs).
    "amplifier-agent[github-copilot] @ git+https://github.com/microsoft/amplifier-agent@main#subdirectory=packages/python",
]

[project.entry-points."amplifier.modules"]
loop-amplifier-agent = "amplifier_module_loop_amplifier_agent:mount"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = true
# Lock-only correction for upstream workspace=true source leakage. This is
# exactly the binding's published engine tag, never a Foundation override.
override-dependencies = [
    "amplifier-agent-engine[github-copilot] @ git+https://github.com/microsoft/amplifier-agent@v0.22.0#subdirectory=packages/engine",
]

[tool.uv.sources]
# Test-only, same-repo path source (dev dependency-group member below). The
# integration test (tests/test_spawn_status_file_transport.py) drives the
# REAL consumer (loop-pipeline's AmplifierBackend) against this module's REAL
# orchestrator, mirroring pipeline-runner's own transport test verbatim for
# this adapter. Editable so the test always runs the working tree's modules.
amplifier-module-loop-pipeline = { path = "../loop-pipeline", editable = true }
# Test-only, same-repo path source: tests/test_worker_parity.py wires this
# module's REAL orchestrator into worker-parity-kit's shared M1-M3 + TARGET
# suite (see that module's README, "Why this exists"). Editable so the test
# always runs the working tree's kit.
amplifier-worker-parity-kit = { path = "../worker-parity-kit", editable = true }
# Test-only, same-repo path source: tests/test_child_session_telemetry.py
# drives the REAL, SHIPPED SessionEventPersister (EXTENSIONS.md Sec 26)
# through this adapter's `_attach_child_session_telemetry`. Deliberately NOT
# a runtime dependency -- the adapter lazy-imports the persister and no-ops
# when it is absent (that module arrives with the pipeline that mounts it),
# so pinning it here as a hard dep would make an optional seam mandatory.
amplifier-module-hooks-pipeline-observability = { path = "../hooks-pipeline-observability", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["amplifier_module_loop_amplifier_agent"]

[tool.hatch.metadata]
allow-direct-references = true

[dependency-groups]
dev = [
    "amplifier-core",
    "pytest>=8.0.0",
    "pytest-asyncio>=1.0.0",
    "amplifier-module-loop-pipeline",
    "amplifier-worker-parity-kit",
    "amplifier-module-hooks-pipeline-observability",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
asyncio_mode = "strict"
