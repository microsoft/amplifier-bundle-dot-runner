# Feature Specify -- the FEATURE sibling of the "specify" stage in the issue
# -> attractor -> PR system. See .github/capsule-pipeline/README.md for what
# this is, its provenance (ported from microsoft/amplifier-bundle-attractor),
# and the deliberate deltas this port carries.
#
# ENGINE-REPO NOTE (read before editing): this workflow runs INSIDE the
# engine's own repository -- see capsule-specify.yml's "Detach the engine"
# step comment for the full rationale; the same detachment happens here.
#
# Trigger: a human applies the `ready:feature-spec` label to an issue. The
# defect lane's epistemic anchor (RED-at-base, informative BECAUSE it could
# have been green) breaks structurally on a feature ask: an absent
# capability makes EVERY candidate gate red at base -- correct, wrong, and
# vacuous alike -- so RED stops discriminating. feature-capsule.dot replaces
# the anchor with BINDING maintainer-authored acceptance criteria, delivered
# over the authenticated issue-comment channel and pinned by digest before
# any budget is spent -- GitHub computes each comment's `author_association`
# server-side from the commenting account's real relationship to this
# repository, unforgeable by a filer.
#
# What it does, at minimum:
#   1. Check out the repo (fetch-depth 60, for the discrimination commit
#      below) and record the base SHA.
#   2. Materialize the issue's title+body as a file (issue_file).
#   3. Materialize authenticated maintainer comments as criteria_file, in
#      the exact delimiter format feature-capsule.dot's `criteria_gate` parses.
#   4. Run .github/capsule-pipeline/feature-capsule.dot end-to-end via the
#      detached engine snapshot.
#   5. Classify, gate, publish a capsule PR (or post a finding/failure),
#      always commenting back on the issue.
#
# Job cannot join "CI Gate (all checks passed)" (.github/workflows/ci.yml)
# for the same isolation reason as capsule-specify.yml.
name: Feature Specify

on:
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      operation:
        description: "Run the normal specify stage, or the one-off issue #78 publication proof"
        required: false
        default: "specify"
        type: choice
        options:
          - specify
          - publish-existing-issue-78
      issue_number:
        description: "Issue number to run the feature-specify stage against"
        required: true
      max_duration:
        description: >-
          Graph-level wall-clock fuse passed to feature-capsule.dot as
          --param max_duration=<value> (e.g. "19800s"). Declarative-only --
          no shell default, so this input always carries one (19800s, this
          graph's historical fuse) and the workflow always forwards it.
          HONESTY: GitHub-hosted runners hard-cap a job at 6h (360min) -- a
          fuse much above 19800s is UNREACHABLE there regardless of this
          input; raising it meaningfully requires a self-hosted runner.
          Seeding is the real convergence lever, not a bigger fuse.
        required: false
        default: "19800s"

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: feature-specify-issue-${{ github.event.issue.number || inputs.issue_number }}
  cancel-in-progress: false

jobs:
  specify:
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.operation != 'publish-existing-issue-78')
      || (github.event_name == 'issues' && github.event.label.name == 'ready:feature-spec')
    name: "Run feature-capsule.dot on issue #${{ github.event.issue.number || inputs.issue_number }}"
    runs-on: ubuntu-latest
    env:
      ISSUE_NUMBER: ${{ github.event.issue.number || inputs.issue_number }}
      MAX_DURATION: ${{ inputs.max_duration || '19800s' }}
    # feature-capsule.dot's own max_pipeline_duration is the engine's
    # internal wall (see the vendored file's provenance box); the job wall
    # must clear that plus setup/PR-creation overhead. GitHub-hosted
    # runners hard-cap a job at 360 minutes -- matching capsule-specify.yml,
    # since MAX_DURATION defaults to 19800s (330min) and a job wall shorter
    # than the engine's own fuse would kill the job before the fuse could
    # ever trip, silently defeating the honest duration_ceiling classify
    # path below (the engine-stdout.log would never gain the "exceeded max
    # duration" line the classify step greps for).
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 60, not the default 1 and not 0 (full history). The
          # discrimination check below needs a real, unrelated commit to
          # re-run the gate at; the default shallow clone gives it exactly
          # one commit to choose from.
          fetch-depth: 60

      - name: Record base SHA and issue metadata
        id: base
        run: |
          set -euo pipefail
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "run_id=$(date -u +%Y%m%dT%H%M%SZ)" >> "$GITHUB_OUTPUT"

      - name: "Pick the discrimination commit (feature-capsule.dot's later_commit)"
        id: discrim
        # feature-capsule.dot's `discrimination_check` re-runs the authored
        # gate at an UNRELATED commit that also lacks the demanded
        # capability and requires RED there: a gate that greens on unrelated
        # code is over-broad. At specify time base_sha IS the tip of main,
        # so no LATER commit exists -- an ancestor satisfies the same
        # requirement at least as strongly (the capability is even more
        # certainly absent there). HEAD~30 is far enough back to be
        # genuinely unrelated, near enough that the tree still has the same
        # module layout. Guarded: if the clone cannot reach that far, the
        # param is omitted and the node records its documented skip.
        run: |
          set -euo pipefail
          later=""
          if git rev-parse --verify --quiet "HEAD~30^{commit}" >/dev/null; then
            later="$(git rev-parse "HEAD~30")"
            echo "discrimination commit: $later ($(git log -1 --format='%h %s' "$later"))"
          else
            echo "::warning::Could not resolve HEAD~30 (clone shallower than expected: $(git rev-list --count HEAD) commit(s) available). Omitting later_commit -- feature-capsule.dot's discrimination_check will record its documented skip instead of running."
          fi
          echo "later_commit=$later" >> "$GITHUB_OUTPUT"

      - name: "Idempotency guard: do not re-spend the budget on an issue that already has a feature capsule"
        id: idem
        # The capsule branch this workflow pushes carries a run timestamp,
        # so the exact name is not stable across runs -- the stable fact is
        # the PREFIX, `feature-capsule/issue-<n>-`. This is a SKIP, not a
        # failure: re-labeling is a normal human action. To deliberately
        # re-run (e.g. after the maintainer posts corrected criteria), merge
        # or delete the existing feature-capsule branch first.
        run: |
          set -euo pipefail
          SKIP=false
          EXISTING="$(git ls-remote --heads origin "refs/heads/feature-capsule/issue-${ISSUE_NUMBER}-*" | awk '{print $2}' | sed 's#^refs/heads/##' | paste -sd' ' -)"
          if [ -n "$EXISTING" ]; then
            SKIP=true
            echo "::notice::A feature capsule branch already exists for issue #${ISSUE_NUMBER}: ${EXISTING}. Skipping this run (idempotency) rather than spending a second multi-hour budget on a competing capsule."
          fi
          echo "skip=$SKIP" >> "$GITHUB_OUTPUT"
          echo "existing=$EXISTING" >> "$GITHUB_OUTPUT"

      - name: "Detach the engine: snapshot this repo's own modules/ out of the workspace"
        if: steps.idem.outputs.skip != 'true'
        # See capsule-specify.yml's identically named step for the full
        # rationale and mechanism (local tar snapshot, root form, pinned to
        # this run's own base SHA -- no clone, no bundles/ copy needed).
        run: |
          set -euo pipefail
          ENGINE_SRC="$RUNNER_TEMP/engine-src"
          rm -rf "$ENGINE_SRC"
          mkdir -p "$ENGINE_SRC"
          tar -cf - \
            --exclude='.git' \
            --exclude='.venv' \
            --exclude='__pycache__' \
            --exclude='*.pyc' \
            --exclude='.github/capsule-pipeline/proposals' \
            . \
          | tar -xf - -C "$ENGINE_SRC"
          echo "engine snapshot: local checkout ($GITHUB_WORKSPACE) -> $ENGINE_SRC"
          echo "engine snapshot provenance: base SHA $(git rev-parse HEAD)"
          for required in \
            "pyproject.toml" \
            "modules/pipeline-runner/pyproject.toml" \
            "modules/loop-pipeline/pyproject.toml" \
            "modules/unified-llm-client/pyproject.toml" \
            "modules/remote-source/pyproject.toml" \
            "modules/loop-agent/pyproject.toml"; do
            if [ ! -f "$ENGINE_SRC/$required" ]; then
              echo "::error::Engine snapshot at $ENGINE_SRC is missing $required -- the detached engine would be unusable and the run step would fail later with a confusing uv error. Refusing to start." >&2
              exit 1
            fi
          done
          if [ -n "$(find "$ENGINE_SRC" -name .venv -print -quit)" ]; then
            echo "::error::Engine snapshot at $ENGINE_SRC contains a .venv -- the tar exclusion did not hold, so the engine is not actually detached from the workspace. Refusing to start." >&2
            exit 1
          fi
          echo "engine snapshot verified: root package + pipeline-runner project present, no .venv carried in"

      - name: Materialize the issue as issue_file
        id: issue
        if: steps.idem.outputs.skip != 'true'
        # BACKGROUND ONLY: feature-capsule.dot never reads acceptance
        # criteria from the issue body (see the workflow header). Same
        # trust model / retry-with-backoff / zero-shell-interpolation
        # construction as capsule-specify.yml's identical step.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          mkdir -p "$RUNNER_TEMP/capsule-run"
          issue_file="$RUNNER_TEMP/capsule-run/issue.md"
          err_file="$RUNNER_TEMP/capsule-run/issue-view.err"

          max_attempts=5
          attempt=1
          issue_json=""
          while :; do
            issue_json="$(gh issue view "$ISSUE_NUMBER" \
              --repo "${{ github.repository }}" \
              --json title,body,url,number 2>"$err_file")"
            rc=$?
            if [ "$rc" -eq 0 ]; then
              break
            fi
            if [ "$attempt" -ge "$max_attempts" ]; then
              echo "::error::gh issue view failed after $attempt attempts (rc=$rc)"
              cat "$err_file" >&2 || true
              exit 1
            fi
            sleep_s=$(( attempt * attempt * 3 ))
            echo "gh issue view attempt $attempt/$max_attempts failed (rc=$rc); retrying in ${sleep_s}s" >&2
            cat "$err_file" >&2 || true
            sleep "$sleep_s"
            attempt=$((attempt + 1))
          done
          set -e

          ISSUE_TITLE_RAW="$(printf '%s' "$issue_json" | jq -r '.title')"
          ISSUE_URL_RAW="$(printf '%s' "$issue_json" | jq -r '.url')"
          ISSUE_NUM_RAW="$(printf '%s' "$issue_json" | jq -r '.number')"

          {
            printf '# %s\n\n' "$ISSUE_TITLE_RAW"
            printf 'Issue: %s (#%s)\n\n' "$ISSUE_URL_RAW" "$ISSUE_NUM_RAW"
            printf 'The issue body below is filer-supplied, unauthenticated background text. feature-capsule.dot NEVER reads acceptance criteria from it -- binding criteria arrive only via criteria_file (authenticated maintainer comments; see the next step).\n\n'
            printf '%s' "$issue_json" | jq -j '.body // ""'
            printf '\n\n[END OF FILER-SUPPLIED ISSUE BODY]\n'
          } > "$issue_file"

          echo "file=$issue_file" >> "$GITHUB_OUTPUT"
          echo "--- issue_file contents ---"
          cat "$issue_file"

      - name: Materialize the authenticated maintainer comments as criteria_file
        id: criteria
        if: steps.idem.outputs.skip != 'true'
        # WHAT feature-capsule.dot's criteria_gate PARSES: a stream of
        #   === COMMENT author=<login> id=<id> updated_at=<iso8601> ===
        #   <body>
        # blocks, eligible comments only (author_association in {OWNER,
        # MEMBER, COLLABORATOR}, non-Bot -- server-side, unforgeable),
        # oldest-first, from which the gate extracts a `## Acceptance
        # criteria (feature-capsule)` block requiring `Owned-by: @<login>`
        # matching the delimiter's authenticated author, a `Scope:` line,
        # and at least one `AC-<n>:` line.
        #
        # NO CAP (unlike issue_file's 30000-char cap): criteria_file is read
        # by an AWK PARSER, not a model -- truncating here could silently
        # drop one of two conflicting maintainers and convert a designed
        # refusal (`conflicting_criteria`) into a false accept.
        #
        # CRLF NORMALIZATION + DELIMITER NEUTRALIZATION: the gate's anchors
        # are line-anchored and CR-intolerant, and its comment-opening rule
        # (`/^=== COMMENT /`) is unconditional and untested against nesting
        # -- an unfenced OR fenced paste of that exact line inside an
        # authenticated comment could otherwise open a forged attributed
        # block. CRs are stripped and any body line matching the delimiter
        # regex is space-prefixed before it is written, so the only real
        # delimiter lines in criteria_file are the ones this step emits,
        # attributed solely from GitHub's authenticated per-comment metadata.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          mkdir -p "$RUNNER_TEMP/capsule-run"
          criteria_file="$RUNNER_TEMP/capsule-run/criteria.md"
          comments_json="$RUNNER_TEMP/capsule-run/issue-comments.json"
          eligible_json="$RUNNER_TEMP/capsule-run/maintainer-comments.json"
          err_file="$RUNNER_TEMP/capsule-run/issue-comments.err"

          max_attempts=5
          attempt=1
          while :; do
            if gh api --paginate \
                 "repos/${{ github.repository }}/issues/${ISSUE_NUMBER}/comments" \
                 2>"$err_file" | jq -s 'add // []' > "$comments_json"; then
              break
            fi
            rc=$?
            if [ "$attempt" -ge "$max_attempts" ]; then
              echo "::error::gh api issues/comments failed after $attempt attempts (rc=$rc)"
              cat "$err_file" >&2 || true
              exit 1
            fi
            sleep_s=$(( attempt * attempt * 3 ))
            echo "gh api issues/comments attempt $attempt/$max_attempts failed (rc=$rc); retrying in ${sleep_s}s" >&2
            cat "$err_file" >&2 || true
            sleep "$sleep_s"
            attempt=$((attempt + 1))
          done
          set -e

          jq '[.[] | select(
                ((.author_association == "OWNER")
                 or (.author_association == "MEMBER")
                 or (.author_association == "COLLABORATOR"))
                and ((.user.type // "") != "Bot"))]' \
            "$comments_json" > "$eligible_json"

          n_total="$(jq 'length' "$comments_json")"
          n_eligible="$(jq 'length' "$eligible_json")"

          jq -r 'def neutralize_delimiters:
                   gsub("\r"; "")
                   | split("\n")
                   | map(if startswith("=== COMMENT ") then " " + . else . end)
                   | join("\n");
                 .[]
                 | "=== COMMENT author=\(.user.login) id=\(.id) updated_at=\(.updated_at) ===\n"
                   + ((.body // "") | neutralize_delimiters)' \
            "$eligible_json" | tr -d '\r' > "$criteria_file"

          bytes="$(wc -c < "$criteria_file" | tr -d ' ')"
          echo "file=$criteria_file" >> "$GITHUB_OUTPUT"
          echo "eligible=$n_eligible" >> "$GITHUB_OUTPUT"
          echo "CRITERIA MATERIALIZED: ${n_eligible} of ${n_total} issue comment(s) authenticated as OWNER/MEMBER/COLLABORATOR and non-Bot; ${bytes} bytes written to ${criteria_file} (no cap applied -- see this step's comment for why)."
          if [ "$n_eligible" -eq 0 ]; then
            echo "::warning::No eligible authenticated maintainer comments on issue #${ISSUE_NUMBER}. criteria_file is empty, so feature-capsule.dot's criteria_gate will take its designed polite-refusal path (no_criteria) before spending any model budget. This is a correct outcome, not an error -- the issue BODY is never trusted for criteria."
          fi
          echo "--- criteria_file contents ---"
          cat "$criteria_file"

      - uses: actions/setup-python@v5
        if: steps.idem.outputs.skip != 'true'
        with:
          python-version: "3.11"

      - name: Install uv
        if: steps.idem.outputs.skip != 'true'
        uses: astral-sh/setup-uv@v4

      - name: "Preflight: the critique judge's provider instance must be serviceable"
        id: preflight
        if: steps.idem.outputs.skip != 'true'
        # feature-capsule.dot's critique node declares llm_provider="luna" -- a
        # CONFIGURED PROVIDER INSTANCE of module provider-openai, i.e. still
        # a second model family, deliberately (owner model policy
        # 2026-09-07; EXTENSIONS Sec 36 addendum 4 -- it replaced a bare
        # llm_provider="openai", llm_model="gpt-[5-9]*" pin). With
        # `--worker coding-agent` that attribute flows straight through the
        # named-worker path -- no dual-provider bundle mount needed.
        #
        # An instance is addressable ONLY if the settings this run reads
        # DECLARE it (provider_instances.settings_scope_paths:
        # $AMPLIFIER_HOME/settings.yaml, then
        # <cwd>/.amplifier/settings*.yaml). A GitHub runner has neither, so
        # this step writes the one the engine will read, into the DEFAULT
        # home (~/.amplifier) -- outside $GITHUB_WORKSPACE on purpose, so it
        # can never dirty the subject tree the gates reset and re-prove.
        #
        # NO SECRET IS WRITTEN TO DISK: the file carries ${VAR} placeholders
        # verbatim, and provider_instances expands them at load time from
        # the environment (os.environ first, keys.env second), leaving an
        # unresolvable one verbatim so a mis-set key surfaces as the
        # provider's own loud auth failure naming the literal ${VAR} --
        # never as a silent empty credential.
        #
        # This does NOT replace, weaken, or stand in for the engine's own
        # #155 provider preflight: that still refuses to start when 'luna'
        # cannot be resolved and mounted, exactly as loud. This runs FIRST
        # so a missing secret is visible before the run's multi-hour budget is
        # spent rather than after.
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ vars.OPENAI_BASE_URL || secrets.OPENAI_BASE_URL }}
        run: |
          set -euo pipefail
          missing=""
          [ -n "${OPENAI_API_KEY:-}" ] || missing="$missing OPENAI_API_KEY"
          if [ -n "$missing" ]; then
            echo "::error::feature-specify: missing repo secret(s):$missing. feature-capsule.dot's critique node declares llm_provider=\"luna\" -- a configured provider INSTANCE of module provider-openai -- and a second model family is the point: the judge must be independent of the maker's family. This workflow defines that instance and it reads its credential from that secret (OPENAI_BASE_URL is OPTIONAL and is NOT a secret: set the Actions VARIABLE of that name to point the instance at a different endpoint, or leave it unset and provider-openai uses its own default); the engine additionally cross-checks every declared provider at startup and refuses to start without a serviceable one. Refusing to start here too, so the failure is visible before the run's multi-hour budget is spent. Provision the named secret(s) as repo secrets, then re-run." >&2
            exit 1
          fi

          # The instance definition the engine will read. Shape mirrors the
          # app CLI's own config.providers[] entries; the `id` key is what
          # makes this an ADDRESSABLE instance (an entry without one is a
          # plain module-level override and is deliberately NOT addressable
          # -- provider_instances.load_provider_instances drops it).
          mkdir -p "$HOME/.amplifier"
          # OPENAI_BASE_URL is OPTIONAL (owner ruling 2026-09-07). Absent, the
          # `base_url` key is simply NOT written and provider-openai uses its
          # own default endpoint -- which is what this instance wants unless
          # someone deliberately points it elsewhere. Two appends rather than
          # one interpolated heredoc because BOTH heredocs stay quoted: the
          # ${VAR} placeholder is what lands on disk, never the value.
          cat > "$HOME/.amplifier/settings.yaml" <<'SETTINGS'
          config:
            providers:
              - id: luna
                module: provider-openai
                source: git+https://github.com/microsoft/amplifier-module-provider-openai@main
                config:
                  api_key: ${OPENAI_API_KEY}
                  default_model: gpt-5.6-luna
                  enable_long_context: 'false'
                  reasoning_effort: high
          SETTINGS
          if [ -n "${OPENAI_BASE_URL:-}" ]; then
            cat >> "$HOME/.amplifier/settings.yaml" <<'BASE_URL'
                  base_url: ${OPENAI_BASE_URL}
          BASE_URL
            echo "OPENAI_BASE_URL is set (Actions variable first, secret as fallback) -- the 'luna' instance pins that endpoint."
          else
            echo "OPENAI_BASE_URL is unset -- OPTIONAL by owner ruling 2026-09-07: no base_url key is written, so the 'luna' instance uses provider-openai's own default endpoint."
          fi
          echo "--- wrote $HOME/.amplifier/settings.yaml (placeholders only; no secret VALUE is on disk) ---"
          cat "$HOME/.amplifier/settings.yaml"
          echo "OPENAI_API_KEY is present and the 'luna' provider instance is declared -- the second-family critique judge can be honored. Proceeding."

      - name: Run feature-capsule.dot (feature specify stage)
        id: run
        if: steps.idem.outputs.skip != 'true'
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ vars.OPENAI_BASE_URL || secrets.OPENAI_BASE_URL }}
        run: |
          set -uo pipefail
          mkdir -p "$RUNNER_TEMP/capsule-run/out" "$RUNNER_TEMP/capsule-run/logs"
          # DETACHED ENGINE: --project points at the $RUNNER_TEMP snapshot
          # taken before any maker touched the tree (root form). --cwd,
          # target_dir and the .dot path below deliberately still point at
          # the WORKSPACE.
          uv run --project "$RUNNER_TEMP/engine-src" dot-runner run \
            .github/capsule-pipeline/feature-capsule.dot \
            --worker coding-agent \
            --cwd "$GITHUB_WORKSPACE" \
            --logs-root "$RUNNER_TEMP/capsule-run/logs" \
            --on-human-gate fail \
            --param issue_file="${{ steps.issue.outputs.file }}" \
            --param criteria_file="${{ steps.criteria.outputs.file }}" \
            --param target_dir="$GITHUB_WORKSPACE" \
            --param base_sha="${{ steps.base.outputs.sha }}" \
            --param later_commit="${{ steps.discrim.outputs.later_commit }}" \
            --param uplift_dir="$GITHUB_WORKSPACE/.github/capsule-pipeline/vendor" \
            --param capsule_out="$RUNNER_TEMP/capsule-run/out" \
            --param max_iterations=8 \
            --param gate_time_ceiling=180 \
            --param max_duration="$MAX_DURATION" \
            2>&1 | tee "$RUNNER_TEMP/capsule-run/logs/engine-stdout.log"
          echo "attractor_exit=$?" >> "$GITHUB_OUTPUT"

      - name: "Fence the capsule pair: record sha256 of every capsule_out file"
        if: always() && steps.idem.outputs.skip != 'true'
        run: |
          set -euo pipefail
          bash .github/capsule-pipeline/capsule_pair_fence.sh record \
            "$RUNNER_TEMP/capsule-run/out" \
            "$RUNNER_TEMP/capsule-pair.sha256"

      - name: "Per-node timing table (job summary)"
        # Issue #64: an agent node that runs for an hour used to leave only
        # prompt.md + response.md + status.json, so "an hour of WHAT?" was
        # unanswerable without downloading and hand-reading the evidence.
        # This joins trace.jsonl to each node's worker-session stream and
        # prints node / round / duration / LLM calls / tool calls / longest
        # single call into the job summary. No LLM, no network, structural
        # data only (ids, counts, durations, statuses -- never notes,
        # prompts, tool arguments or tool results). Never fails the job.
        if: always()
        run: |
          set -euo pipefail
          python3 .github/capsule-pipeline/node_timing_table.py \
            --logs-root "$RUNNER_TEMP/capsule-run/logs" \
            --json-out "$RUNNER_TEMP/capsule-run/logs/timing-rollup.json"

      - name: "Capsule artifacts: a secret finding FAILS the run, never redacts"
        id: capsule_secret_gate
        if: always() && steps.idem.outputs.skip != 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ vars.OPENAI_BASE_URL || secrets.OPENAI_BASE_URL }}
          SCRUB_WATCH_ENV: OPENAI_BASE_URL
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CAPSULE_PR_TOKEN: ${{ secrets.CAPSULE_PR_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo "capsule_clean=false" >> "$GITHUB_OUTPUT"
          if python3 .github/capsule-pipeline/scrub_secrets.py scan \
              "$RUNNER_TEMP/capsule-run/out"; then
            echo "capsule_clean=true" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Secret-shaped material found in the CAPSULE ARTIFACTS (see the scan findings above for file/line/shape; values are never printed). These artifacts are never redacted in place. The capsule PR is BLOCKED and this run fails. Rotate any credential the findings implicate, then re-run." >&2
            exit 1
          fi

      - name: Scrub secrets from run evidence
        if: always() && steps.idem.outputs.skip != 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ vars.OPENAI_BASE_URL || secrets.OPENAI_BASE_URL }}
          SCRUB_WATCH_ENV: OPENAI_BASE_URL
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CAPSULE_PR_TOKEN: ${{ secrets.CAPSULE_PR_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 .github/capsule-pipeline/scrub_secrets.py scrub \
            "$RUNNER_TEMP/capsule-run/logs" \
            "$GITHUB_WORKSPACE/.ai"

      - name: "Bound session-evidence size (and say what was dropped)"
        # Issue #64: with the Sec 26 persister finally mounted, every agent
        # node writes <stage>/sessions/<id>/events.jsonl and each tool:post
        # record carries that tool's full output -- unbounded. Cap it,
        # keeping the HEAD (what the node set out to do) and the TAIL (where
        # it actually stopped), with one `evidence:truncated` record naming
        # exactly what went. A silent drop would be worse than no evidence.
        #
        # ORDER IS LOAD-BEARING: after the scrub (kept bytes are already
        # redacted) and before the residual gate (the gate scans EXACTLY the
        # bytes that get uploaded). Capping only removes whole lines, so it
        # cannot reintroduce anything the scrub removed -- proved in
        # .github/capsule-pipeline/test_session_evidence.py.
        if: always()
        run: |
          set -euo pipefail
          python3 .github/capsule-pipeline/cap_session_evidence.py \
            "$RUNNER_TEMP/capsule-run/logs" \
            "$GITHUB_WORKSPACE/.ai"

      - name: Classify the result
        id: classify
        if: always() && steps.idem.outputs.skip != 'true'
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/capsule-run/out"
          kind="failure"
          id=""
          if ls "$OUT"/*.verify.sh >/dev/null 2>&1; then
            kind="capsule"
            id="$(basename "$(ls "$OUT"/*.verify.sh | head -1)" .verify.sh)"
          elif [ -f "$GITHUB_WORKSPACE/.ai/findings/no-criteria.md" ]; then
            kind="no_criteria"
          elif [ -f "$GITHUB_WORKSPACE/.ai/findings/cant-write-gate.md" ]; then
            kind="cant_gate"
          elif grep -q "exceeded max duration" "$RUNNER_TEMP/capsule-run/logs/engine-stdout.log" 2>/dev/null; then
            # CLASSIFICATION HONESTY (ported from capsule-specify.yml/ba9):
            # the engine's own wall-clock fuse tripped mid-work -- never
            # "did not converge within its iteration budget". The fuse-exit
            # path bypasses the engine's recover/postmortem wall entirely (a
            # known, separate engine gap, not fixed here), so no postmortem
            # is ever possible here.
            kind="duration_ceiling"
          fi
          duration_hint="no further detail available"
          if [ "$kind" = "duration_ceiling" ]; then
            # Issue #64: the old sentence ("N iteration(s) completed
            # against a starting budget of M") reads as under-performance
            # when the real finding is usually that M was never reachable
            # at this graph's measured per-iteration cost. The hint now
            # carries the arithmetic -- N of M, the fuse, the MEASURED mean
            # iteration cost, and how many iterations that cost actually
            # affords -- so the ceiling is legible and the next budget
            # change has its evidence inline.
            #
            # max_iterations is NOT reconciled here the way capsule-specify's
            # was: that one had a measured cost (run 34039364352). This
            # graph does not yet. Rather than guess a number, this prints
            # the cost on every ceiling hit so the reconciliation, when it
            # happens, is evidence-based.
            duration_hint="$(python3 .github/capsule-pipeline/ceiling_hint.py \
              --fuse "${MAX_DURATION:-19800s}" \
              --max-iterations 8 \
              --checkpoint "$RUNNER_TEMP/capsule-run/logs/checkpoint.json" \
              --timing "$RUNNER_TEMP/capsule-run/logs/timing-rollup.json")"
          fi
          echo "kind=$kind" >> "$GITHUB_OUTPUT"
          echo "id=$id" >> "$GITHUB_OUTPUT"
          echo "duration_hint=$duration_hint" >> "$GITHUB_OUTPUT"
          echo "Classified as: kind=$kind id=$id duration_hint=$duration_hint"

      - name: Classify the terminal outcome
        id: outcome
        # A criteria refusal or a question for its owner is a truthful,
        # successful stop, not a failed attempt to converge.
        if: always() && steps.idem.outputs.skip != 'true'
        run: |
          set -euo pipefail
          set +e
          python3 .github/capsule-pipeline/outcome_classifier.py classify \
            --stage feature \
            --ai-dir "$GITHUB_WORKSPACE/.ai" \
            --out-dir "$RUNNER_TEMP/capsule-run/out" \
            --log-dir "$RUNNER_TEMP/capsule-run/logs" \
            --github-output "$GITHUB_OUTPUT"
          classifier_exit=$?
          set -e
          echo "terminal outcome classifier exit: $classifier_exit"

      - name: "Execute the SHIPPED gate at the pinned base SHA"
        id: gate_exec
        if: always() && steps.classify.outputs.kind == 'capsule' && steps.capsule_secret_gate.outputs.capsule_clean == 'true'
        # Capped at 300s: feature-capsule.dot's own gate_time_ceiling is 180s.
        run: |
          set -euo pipefail
          echo "gate_ok=false" >> "$GITHUB_OUTPUT"
          bash .github/capsule-pipeline/verify_shipped_gate.sh \
            --lane feature \
            --capsule-dir "$RUNNER_TEMP/capsule-run/out" \
            --id "${{ steps.classify.outputs.id }}" \
            --repo "$GITHUB_WORKSPACE" \
            --base-sha "${{ steps.base.outputs.sha }}" \
            --log-dir "$RUNNER_TEMP/capsule-run/logs/shipped-gate" \
            --timeout 300
          echo "gate_ok=true" >> "$GITHUB_OUTPUT"

      - name: Open feature capsule PR
        id: pr
        if: always() && steps.classify.outputs.kind == 'capsule' && steps.capsule_secret_gate.outputs.capsule_clean == 'true' && steps.gate_exec.outputs.gate_ok == 'true'
        env:
          GH_TOKEN: ${{ secrets.CAPSULE_PR_TOKEN || github.token }}
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/capsule-run/out"
          ID="${{ steps.classify.outputs.id }}"
          ISSUE="$ISSUE_NUMBER"
          BRANCH="feature-capsule/issue-${ISSUE}-${{ steps.base.outputs.run_id }}"
          DEST=".github/capsule-pipeline/proposals/issue-${ISSUE}"

          cd "$GITHUB_WORKSPACE"
          if [ -n "$(git status --porcelain)" ] || [ "$(git rev-parse HEAD)" != "${{ steps.base.outputs.sha }}" ]; then
            echo "::error::Workspace is not clean at the pinned base SHA after the pipeline run -- refusing to build a capsule PR from an unproven tree." >&2
            git status --porcelain >&2 || true
            exit 1
          fi

          bash .github/capsule-pipeline/capsule_pair_fence.sh verify \
            "$OUT" "$RUNNER_TEMP/capsule-pair.sha256"

          # This only establishes that the credential can perform this
          # read. It does NOT prove that it can push or create a PR; those
          # operations retain their real failures below. Run it before any
          # publication-side mutation so an unavailable credential cannot
          # leave a local branch or remote branch behind.
          if ! gh api graphql -f query='query { viewer { login } }' >/dev/null; then
            echo "::error::Could not verify the configured GitHub credential before capsule publication. The failure may be due to network, authentication, or permissions; no branch was created, committed, or pushed. A successful viewer query would not prove permission to create a pull request." >&2
            exit 1
          fi

          git checkout -b "$BRANCH"
          mkdir -p "$DEST"
          cp "$OUT"/"$ID".md "$OUT"/"$ID".verify.sh "$DEST"/
          chmod +x "$DEST/$ID.verify.sh"
          for extra in base-sha discrimination.md criteria-digest; do
            f="$OUT/$ID.$extra"
            [ -f "$f" ] && cp "$f" "$DEST/"
          done
          for f in "$OUT/$ID".*.py "$OUT/$ID".*.json; do
            [ -f "$f" ] && cp "$f" "$DEST/"
          done

          echo "ship-what-you-verified: re-running the shipped-gate check against the COMMITTED set ($DEST)"
          bash .github/capsule-pipeline/verify_shipped_gate.sh \
            --lane feature \
            --capsule-dir "$GITHUB_WORKSPACE/$DEST" \
            --id "$ID" \
            --repo "$GITHUB_WORKSPACE" \
            --base-sha "${{ steps.base.outputs.sha }}" \
            --log-dir "$RUNNER_TEMP/capsule-run/logs/shipped-gate-committed" \
            --timeout 300
          echo "ship-what-you-verified: the committed set reproduces the verified capsule. Proceeding to commit."

          COMMIT_MSG_FILE="$RUNNER_TEMP/capsule-run/commit-msg.txt"
          {
            echo "specify(feature): work capsule for issue #${ISSUE} (${ID})"
            echo
            echo "Produced by the feature-capsule.dot specify-stage pipeline from issue"
            echo "#${ISSUE}, pinned to base SHA ${{ steps.base.outputs.sha }}, anchored to"
            echo "maintainer-authored acceptance criteria delivered over the authenticated"
            echo "issue-comment channel and pinned by digest. This PR is the specify-stage"
            echo "artifact for human review -- it contains no implementation; merging it is"
            echo "the signal to proceed to the implement stage."
            echo
            echo "🤖 Generated with [Amplifier](https://github.com/microsoft/amplifier)"
            echo
            echo "Co-Authored-By: Amplifier <240397093+microsoft-amplifier@users.noreply.github.com>"
          } > "$COMMIT_MSG_FILE"

          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              add "$DEST"
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -F "$COMMIT_MSG_FILE"
          git push origin "$BRANCH"

          BODY_FILE="$RUNNER_TEMP/capsule-run/pr-body.md"
          {
            echo "## Feature specify-stage work capsule for #${ISSUE}"
            echo
            echo "Refs #${ISSUE}. Produced by \`feature-capsule.dot\` (see"
            echo "\`.github/capsule-pipeline/\`), pinned to base SHA"
            echo "\`${{ steps.base.outputs.sha }}\`, anchored to maintainer-authored"
            echo "acceptance criteria (not RED-at-base -- an absent capability makes"
            echo "every candidate gate red, so red cannot discriminate for a feature ask)."
            echo
            echo "1. **Criteria fidelity, both directions**: the declared \`criteria_digest\`"
            echo "   pins exactly which authenticated maintainer comment(s) this capsule"
            echo "   answers -- verify it still matches the issue thread."
            echo "2. **Non-vacuity (feature sense)**: a capability STUB must NOT green the gate."
            echo
            echo "This PR contains **no implementation** -- merging it approves the"
            echo "definition of done; implementing a real fix is a separate, later stage."
            echo
            echo "Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          } > "$BODY_FILE"

          url=$(gh pr create --repo "${{ github.repository }}" \
            --title "specify(feature): work capsule for issue #${ISSUE}" \
            --body-file "$BODY_FILE" \
            --base main --head "$BRANCH")
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Comment on the issue with the outcome
        if: always() && steps.idem.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ steps.pr.outputs.url }}
          CAPSULE_SECRET_GATE: ${{ steps.capsule_secret_gate.outcome }}
          GATE_EXEC: ${{ steps.gate_exec.outcome }}
          PR_STEP: ${{ steps.pr.outcome }}
        run: |
          set -euo pipefail
          COMMENT="$RUNNER_TEMP/capsule-run/comment.md"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          KIND="${{ steps.classify.outputs.kind }}"
          OUTCOME="${{ steps.outcome.outputs.kind }}"
          DURATION_HINT="${{ steps.classify.outputs.duration_hint }}"

          # Publication status is an outer boundary, independent from the
          # pipeline's inner terminal evidence. A real capsule must not be
          # reported as a classifier refusal merely because residual evidence
          # also exists: it is opened only after this step succeeded and
          # supplied a non-empty PR URL.
          if [ "$KIND" = "capsule" ] && [ "$PR_STEP" = "success" ] && [ -n "${PR_URL:-}" ]; then
            KIND="capsule"
          elif [ "$KIND" = "capsule" ]; then
            KIND="capsule_blocked"
          fi

          if [ "$KIND" != "capsule" ] && [ "$KIND" != "capsule_blocked" ] && \
             { [ "$OUTCOME" = "refused_unspecced" ] || \
               [ "$OUTCOME" = "refused_escalation" ] || \
               [ "$OUTCOME" = "blocked_on_criteria" ] || \
               [ "$OUTCOME" = "escalated" ] || \
               [ "$OUTCOME" = "green_at_base" ] || \
               [ "$OUTCOME" = "partial_met" ]; }; then
            python3 .github/capsule-pipeline/outcome_classifier.py comment \
              --outcome "$OUTCOME" \
              --ai-dir "$GITHUB_WORKSPACE/.ai" \
              --run-url "$RUN_URL" > "$COMMENT"
          else
          case "$KIND" in
            capsule)
              {
                echo "**Feature specify stage: work capsule opened.**"
                echo
                echo "$PR_URL"
                echo
                echo "Please review the proposed definition of done before merging (merging"
                echo "approves the capsule; it does not implement anything)."
                echo
                echo "Workflow run: $RUN_URL"
              } > "$COMMENT"
              ;;
            capsule_blocked)
              {
                echo "**Feature specify stage: a work capsule was produced, but publication did not complete -- no PR URL is available.**"
                echo
                echo "**What happened:** the pipeline produced a work capsule, but the"
                echo "publication boundary did not complete. Check the statuses below and"
                echo "the workflow run for the failed or skipped publication step."
                echo
                echo "**What happens next:** a maintainer will personally review this issue"
                echo "and follow up. The capsule itself is preserved in this run's evidence."
                echo
                echo "<details>"
                echo "<summary>Which check blocked it (for maintainers)</summary>"
                echo
                echo "| check | outcome |"
                echo "| --- | --- |"
                echo "| capsule artifacts free of secret-shaped material | \`${CAPSULE_SECRET_GATE:-did not run}\` |"
                echo "| shipped gate executes at the pinned base SHA | \`${GATE_EXEC:-did not run}\` |"
                echo "| open capsule PR (includes the pair-integrity fence) | \`${PR_STEP:-did not run}\` |"
                echo
                echo "Workflow run: $RUN_URL"
                echo
                echo "</details>"
              } > "$COMMENT"
              ;;
            no_criteria)
              {
                echo "**Feature specify stage: no binding acceptance criteria found yet.**"
                echo
                echo "**What happened:** this pipeline requires maintainer-authored"
                echo "acceptance criteria, delivered as an issue COMMENT from an OWNER,"
                echo "MEMBER, or COLLABORATOR of this repository (never the issue body)."
                echo "None was found."
                echo
                echo "**If you filed this issue and are not a maintainer:** this is expected"
                echo "-- a maintainer needs to post a \`## Acceptance criteria"
                echo "(feature-capsule)\` comment with \`Owned-by:\`, \`Scope:\`, and at least"
                echo "one \`AC-<n>:\` line before this pipeline can proceed. Re-apply the"
                echo "\`ready:feature-spec\` label."
                echo
                echo "Workflow run: $RUN_URL"
              } > "$COMMENT"
              ;;
            cant_gate)
              {
                echo "**Feature specify stage: the automated pipeline couldn't produce a verified work plan for this yet.**"
                echo
                echo "**What happened:** the pipeline could not prove within its budget that"
                echo "the gate it wrote genuinely discriminates (absent on a stub, present on"
                echo "a real implementation)."
                echo
                echo "**What happens next:** a maintainer will personally review this issue"
                echo "and follow up."
                echo
                echo "<details>"
                echo "<summary>Technical finding (for maintainers)</summary>"
                echo
                cat "$GITHUB_WORKSPACE/.ai/findings/cant-write-gate.md" 2>/dev/null || echo "(finding file missing)"
                echo
                echo "Workflow run: $RUN_URL"
                echo
                echo "</details>"
              } > "$COMMENT"
              ;;
            duration_ceiling)
              {
                echo "**Feature specify stage: hit its wall-clock ceiling mid-work -- no postmortem is possible on this path.**"
                echo
                echo "**What happened:** the pipeline was still doing real work (not stalled)"
                echo "when it hit its wall-clock fuse. ${DURATION_HINT:-}"
                echo
                echo "**Why there is no postmortem here:** the fuse exits the run directly,"
                echo "before the engine's own recover/postmortem step ever gets a chance to"
                echo "run -- a known, separate engine limitation, not a sign anything else"
                echo "went wrong. This is NOT the same thing as \"ran out of iteration budget"
                echo "without converging\"."
                echo
                echo "**What happens next:** a maintainer will personally review this issue"
                echo "and follow up."
                echo
                echo "Workflow run: $RUN_URL"
              } > "$COMMENT"
              ;;
            *)
              {
                echo "**Feature specify stage: the automated pipeline couldn't produce a verified work plan for this yet.**"
                echo
                echo "**What happened:** the pipeline ran, but did not converge on a proven"
                echo "work capsule within its iteration budget."
                echo
                echo "**What happens next:** a maintainer will personally review this issue"
                echo "and follow up."
                echo
                echo "<details>"
                echo "<summary>Technical postmortem (for maintainers)</summary>"
                echo
                echo '````'
                cat "$GITHUB_WORKSPACE/.ai/postmortem/report.md" 2>/dev/null || echo "(no postmortem report was written)"
                echo '````'
                echo
                echo "Workflow run: $RUN_URL"
                echo
                echo "</details>"
              } > "$COMMENT"
              ;;
          esac
          fi

          gh issue comment "$ISSUE_NUMBER" \
            --repo "${{ github.repository }}" \
            --body-file "$COMMENT"

      - name: "Residual secret gate: block the upload if anything secret-shaped remains"
        id: secret_gate
        if: always() && steps.idem.outputs.skip != 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ vars.OPENAI_BASE_URL || secrets.OPENAI_BASE_URL }}
          SCRUB_WATCH_ENV: OPENAI_BASE_URL
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CAPSULE_PR_TOKEN: ${{ secrets.CAPSULE_PR_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo "upload_ok=false" >> "$GITHUB_OUTPUT"
          if python3 .github/capsule-pipeline/scrub_secrets.py gate \
              --never-redact "$RUNNER_TEMP/capsule-run/out" \
              "$RUNNER_TEMP/capsule-run" \
              "$GITHUB_WORKSPACE/.ai"; then
            echo "upload_ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::error::The residual secret gate BLOCKED the run-evidence artifact upload (see the scan findings above for file/line/shape; values are never printed). Nothing was uploaded. Rotate any credential the findings implicate before touching this run's evidence." >&2
            exit 1
          fi

      - name: Upload run evidence (logs, .ai state, capsule_out)
        if: always() && steps.idem.outputs.skip != 'true' && steps.secret_gate.outputs.upload_ok == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: feature-specify-issue-${{ env.ISSUE_NUMBER }}-${{ steps.base.outputs.run_id }}
          path: |
            ${{ runner.temp }}/capsule-run/logs
            ${{ runner.temp }}/capsule-run/out
            ${{ github.workspace }}/.ai
          # Keep scrubbed terminal evidence: .ai/findings/,
          # .ai/criteria-refusal.md, and .ai/escalation.md when present.
          include-hidden-files: true
          if-no-files-found: warn

      - name: Fail the job on genuine non-convergence
        if: always() && steps.idem.outputs.skip != 'true'
        run: |
          set -euo pipefail
          OUTCOME="${{ steps.outcome.outputs.kind }}"
          if [ "$OUTCOME" = "fuse" ]; then
            echo "::error::feature-capsule.dot hit its wall-clock ceiling mid-work (${{ steps.classify.outputs.duration_hint }}) -- this is NOT 'did not converge within its iteration budget', and no postmortem is possible on this path."
            exit 1
          fi
          if [ "$OUTCOME" = "non_convergence" ]; then
            echo "::error::feature-capsule.dot did not converge (no capsule, no recorded finding) -- see the postmortem comment posted on the issue and the uploaded run evidence."
            exit 1
          fi

  publication-proof-validation:
    # This is a one-off, deliberately narrow proof of the publication boundary.
    # It is not a second feature-specify implementation path and never invokes
    # feature-capsule.dot or accepts a newly generated capsule.
    if: >-
      github.event_name == 'workflow_dispatch'
      && inputs.operation == 'publish-existing-issue-78'
      && github.repository == 'microsoft/amplifier-bundle-dot-runner'
      && github.ref == 'refs/heads/proof/publication-issue-78-20260908'
      && inputs.issue_number == '78'
    name: "Validate existing issue #78 capsule for publication proof"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      verdict: ${{ steps.verdict.outputs.verdict }}
    steps:
      - name: Checkout trusted proof verifier
        uses: actions/checkout@v4
        with:
          # actions/checkout requires a token input.  github.token is valid
          # here because this read-only job receives no publication secret.
          token: ${{ github.token }}
          persist-credentials: false
          ref: 58d4041bd9876f8b0e15a48ae1db0c0d0519bb6f
          fetch-depth: 0

      - name: Restrict the dispatched proof commit to reviewed files
        env:
          WORKFLOW_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          TRUSTED_SHA='58d4041bd9876f8b0e15a48ae1db0c0d0519bb6f'
          [[ "$WORKFLOW_SHA" =~ ^[0-9a-f]{40}$ ]] \
            || { echo "::error::workflow SHA is not a full lowercase Git SHA." >&2; exit 1; }
          git fetch --no-tags origin "$WORKFLOW_SHA"
          [ "$(git rev-parse FETCH_HEAD)" = "$WORKFLOW_SHA" ] \
            || { echo "::error::Fetched workflow commit does not match github.sha." >&2; exit 1; }
          expected="$(cat <<'EOF'
          .github/capsule-pipeline/test_publication_boundary.py
          .github/workflows/feature-specify.yml
          EOF
          )"
          actual="$(git diff --name-only "$TRUSTED_SHA" "$WORKFLOW_SHA" | LC_ALL=C sort)"
          [ "$actual" = "$expected" ] \
            || { echo "::error::Dispatched proof commit changes files outside the reviewed allowlist." >&2; exit 1; }

      - name: Set up Python for the locked verifier dependencies
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Pin and save the five reviewed capsule files
        run: |
          set -euo pipefail
          CAPSULE_BRANCH='feature-capsule/issue-78-20260908T123833Z'
          CAPSULE_SHA='4bbc8f3d04b97b27ca4710453063bd2453eeba02'
          BASE_SHA='fb35263d598187f05f33908c36f72287b95f4bfb'
          CAPSULE_DIR='.github/capsule-pipeline/proposals/issue-78'
          ID='ci-safe-escalated-human-gate'
          SAVED="$RUNNER_TEMP/publication-proof/capsule"
          IDENTITY_MANIFEST="$RUNNER_TEMP/publication-proof/reviewed-capsule.sha256"
          PAIR_MANIFEST="$RUNNER_TEMP/publication-proof/capsule-pair.sha256"

          git fetch --no-tags origin "refs/heads/$CAPSULE_BRANCH"
          [ "$(git rev-parse FETCH_HEAD)" = "$CAPSULE_SHA" ] \
            || { echo "::error::Reviewed capsule branch no longer resolves to its pinned SHA." >&2; exit 1; }
          [ "$(git rev-parse "$CAPSULE_SHA^")" = "$BASE_SHA" ] \
            || { echo "::error::Reviewed capsule commit no longer has its pinned base parent." >&2; exit 1; }

          expected_paths="$(cat <<EOF
          $CAPSULE_DIR/$ID.base-sha
          $CAPSULE_DIR/$ID.criteria-digest
          $CAPSULE_DIR/$ID.discrimination.md
          $CAPSULE_DIR/$ID.md
          $CAPSULE_DIR/$ID.verify.sh
          EOF
          )"
          actual="$(git ls-tree -r --name-only "$CAPSULE_SHA" "$CAPSULE_DIR" | LC_ALL=C sort)"
          [ "$actual" = "$expected_paths" ] \
            || { echo "::error::Reviewed capsule does not contain exactly the five pinned files." >&2; exit 1; }

          mkdir -p "$SAVED"
          while IFS= read -r path; do
            git show "$CAPSULE_SHA:$path" > "$SAVED/$(basename "$path")"
          done <<EOF
          $expected_paths
          EOF
          (
            cd "$SAVED"
            cat > "$IDENTITY_MANIFEST" <<'EOF'
          3af62c0008871c70243919a489c8d9fc5c412d3dcb7eee5e530b3ff044563a0f  ci-safe-escalated-human-gate.base-sha
          1a7a95456b70ae512d46d117ff5c09cc8a8c50a6b5e377dd984ddda579eb29b1  ci-safe-escalated-human-gate.criteria-digest
          b76f07edc5258b3c4b0276721ead5967bacc6058b3f57a16d600583c08e27be2  ci-safe-escalated-human-gate.discrimination.md
          a4eb564b2823f4f639493663bc4dbd4564c5ec6ba244b11a785b6eca2d40d13c  ci-safe-escalated-human-gate.md
          0d17814534721af0288c4fdf727ea2b79e31edc50d4674881f0aff47913db6af  ci-safe-escalated-human-gate.verify.sh
          EOF
            expected_names="$(awk '{print $2}' "$IDENTITY_MANIFEST" | LC_ALL=C sort)"
            actual_names="$(find . -maxdepth 1 -type f -printf '%f\n' | LC_ALL=C sort)"
            [ "$actual_names" = "$expected_names" ] \
              || { echo "::error::Saved capsule does not contain exactly the reviewed manifest files." >&2; exit 1; }
            sha256sum --check --strict "$IDENTITY_MANIFEST"
          )
          [ "$(tr -d '\r\n' < "$SAVED/$ID.base-sha")" = "$BASE_SHA" ] \
            || { echo "::error::Capsule base-sha file does not match its pinned parent." >&2; exit 1; }
          [ "$(tr -d '\r\n' < "$SAVED/$ID.criteria-digest")" = 'f9561b323c08266bcb4973d53fc19a16e041d09ff7d08cf00262e26d08711908' ] \
            || { echo "::error::Capsule criteria digest does not match the reviewed identity." >&2; exit 1; }
          grep -qx "id: $ID" "$SAVED/$ID.md"
          grep -qx "base_sha: $BASE_SHA" "$SAVED/$ID.md"
          grep -qx 'criteria_digest: f9561b323c08266bcb4973d53fc19a16e041d09ff7d08cf00262e26d08711908' "$SAVED/$ID.md"

          bash .github/capsule-pipeline/capsule_pair_fence.sh record "$SAVED" "$PAIR_MANIFEST"
          chmod a-w "$SAVED"/*
          bash .github/capsule-pipeline/capsule_pair_fence.sh verify "$SAVED" "$PAIR_MANIFEST"

      - name: Run archived verifier without Actions command channels
        run: |
          set -euo pipefail
          ID='ci-safe-escalated-human-gate'
          BASE_SHA='fb35263d598187f05f33908c36f72287b95f4bfb'
          SAVED="$RUNNER_TEMP/publication-proof/capsule"
          VERIFIER_LOG="$RUNNER_TEMP/publication-proof/archived-verifier.log"
          TRUSTED_REPO="$GITHUB_WORKSPACE"
          mkdir -p "$RUNNER_TEMP/publication-proof/tmp" "$RUNNER_TEMP/publication-proof/uv-cache"

          # The archived verifier is untrusted input.  It receives only the
          # runtime it needs; no GitHub, provider, capsule, or Actions command
          # file environment is inherited.  Its raw output stays local.
          if ! env -i \
              PATH="$PATH" \
              HOME="$HOME" \
              TMPDIR="$RUNNER_TEMP/publication-proof/tmp" \
              RUNNER_TEMP="$RUNNER_TEMP" \
              UV_CACHE_DIR="$RUNNER_TEMP/publication-proof/uv-cache" \
              bash .github/capsule-pipeline/verify_shipped_gate.sh \
                --lane feature \
                --capsule-dir "$SAVED" \
                --id "$ID" \
                --repo "$TRUSTED_REPO" \
                --base-sha "$BASE_SHA" \
                --log-dir "$RUNNER_TEMP/publication-proof/shipped-gate" \
                --timeout 300 >"$VERIFIER_LOG" 2>&1; then
            echo "::error::Reviewed capsule did not reproduce its expected RED verdict." >&2
            exit 1
          fi
          echo "Archived verifier passed: expected RED verdict reproduced for issue #78."

      - name: Record trusted validation verdict
        id: verdict
        run: |
          set -euo pipefail
          echo "verdict=passed" >> "$GITHUB_OUTPUT"

  publication-proof-publish:
    if: >-
      github.event_name == 'workflow_dispatch'
      && inputs.operation == 'publish-existing-issue-78'
      && github.repository == 'microsoft/amplifier-bundle-dot-runner'
      && github.ref == 'refs/heads/proof/publication-issue-78-20260908'
      && inputs.issue_number == '78'
      && needs.publication-proof-validation.result == 'success'
    name: "Publish one existing issue #78 capsule proof PR"
    needs: publication-proof-validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Preflight and create one draft proof PR
        env:
          # This is the only publication credential injection.  TOKEN_SOURCE
          # records only which expression branch was selected, never a value.
          GH_TOKEN: ${{ secrets.CAPSULE_PR_TOKEN || github.token }}
          TOKEN_SOURCE: ${{ secrets.CAPSULE_PR_TOKEN != '' && 'CAPSULE_PR_TOKEN' || 'GITHUB_TOKEN' }}
        run: |
          set -euo pipefail
          REPO='microsoft/amplifier-bundle-dot-runner'
          CAPSULE_BRANCH='feature-capsule/issue-78-20260908T123833Z'
          CAPSULE_SHA='4bbc8f3d04b97b27ca4710453063bd2453eeba02'
          WORK="$RUNNER_TEMP/publication-proof"
          mkdir -p "$WORK"

          if ! viewer="$(gh api graphql -f query='query { viewer { login } }' --jq '.data.viewer.login' 2>"$WORK/viewer.err")"; then
            echo "::error::Publication credential preflight failed; no PR was created." >&2
            exit 1
          fi
          remote_head="$(git ls-remote --heads "https://github.com/$REPO.git" "refs/heads/$CAPSULE_BRANCH" | awk '{print $1}')"
          [ "$remote_head" = "$CAPSULE_SHA" ] \
            || { echo "::error::Capsule branch no longer resolves to the reviewed SHA; no PR was created." >&2; exit 1; }
          existing="$(gh pr list --repo "$REPO" --head "$CAPSULE_BRANCH" --base main --state all --json url --jq 'length' 2>"$WORK/pr-list.err")"
          [ "$existing" = '0' ] \
            || { echo "::error::A PR already exists for the fixed capsule branch; refusing to create another." >&2; exit 1; }

          cat > "$WORK/body.md" <<'BODY'
          Publication proof only: existing specify-stage RED capsule.

          Refs #78.

          This draft proves the guarded publication boundary can create a pull request.
          It neither accepts the capsule nor authorizes a merge.
          BODY
          url="$(gh pr create --draft --repo "$REPO" \
            --base main --head "$CAPSULE_BRANCH" \
            --title 'publication proof: existing specify-stage RED capsule for issue #78' \
            --body-file "$WORK/body.md" 2>"$WORK/pr-create.err")"
          gh pr view "$url" --repo "$REPO" \
            --json url,state,isDraft,headRefName,headRefOid,baseRefName,labels,autoMergeRequest,author \
            > "$WORK/pr.json" 2>"$WORK/pr-view.err"
          python3 - "$WORK/pr.json" "$viewer" "$CAPSULE_BRANCH" "$CAPSULE_SHA" <<'PY'
          import json
          import sys

          path, viewer, branch, sha = sys.argv[1:]
          with open(path, encoding="utf-8") as handle:
              pr = json.load(handle)
          expected = {
              "state": "OPEN",
              "isDraft": True,
              "headRefName": branch,
              "headRefOid": sha,
              "baseRefName": "main",
          }
          for field, value in expected.items():
              if pr.get(field) != value:
                  raise SystemExit(f"publication readback mismatch: {field}")
          if pr.get("labels") or pr.get("autoMergeRequest") is not None:
              raise SystemExit("publication readback mismatch: labels or auto-merge")
          if (pr.get("author") or {}).get("login") != viewer:
              raise SystemExit("publication readback mismatch: author")
          if not pr.get("url"):
              raise SystemExit("publication readback mismatch: missing URL")
          PY
          {
            echo "Publication proof PR: $url"
            echo "Capsule SHA: $CAPSULE_SHA"
            echo "Token source: $TOKEN_SOURCE"
          } >> "$GITHUB_STEP_SUMMARY"
